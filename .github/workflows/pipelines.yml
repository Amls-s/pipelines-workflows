# Kenya Schools Data Pipeline

A small pipeline to download, merge, deduplicate and export Kenyan schools datasets into CSV and GeoJSON formats.

This repository contains:
- `merge_kenya_schools.py` — main script that downloads sources, merges and cleans records, writes `kenya_schools_cleaned.csv` and `kenya_schools_cleaned.geojson`.
- `requirements.txt` — Python dependencies (some optional / heavy geospatial packages may be omitted depending on your environment).
- `kenya_schools_cleaned.csv` — example cleaned output (generated).
- `kenya_schools_cleaned.geojson` — example GeoJSON output (generated).

Quick start (local)
1. Clone the repo and enter it:
   ```bash
   git clone https://github.com/Amls-s/arepo.git
   cd arepo
   ```

2. Create and activate a virtual environment:
   ```bash
   python3 -m venv .venv
   source .venv/bin/activate
   ```

3. (Optional) If your network or system has trouble installing compiled geospatial packages, remove them from `requirements.txt` before installing:
   ```bash
   # view requirements
   sed -n '1,200p' requirements.txt

   # remove geopandas/shapely lines if necessary
   sed -i '/geopandas/d; /shapely/d' requirements.txt
   ```

4. Install dependencies:
   ```bash
   python3 -m pip install --upgrade pip
   python3 -m pip install -r requirements.txt
   ```

5. Run the pipeline:
   ```bash
   python3 merge_kenya_schools.py
   ```

Outputs
- `kenya_schools_cleaned.csv` — cleaned table (includes header).
- `kenya_schools_cleaned.geojson` — GeoJSON produced via geopandas (if geopandas was available).

Notes and troubleshooting
- If pip fails to download packages due to network/DNS issues, try:
  ```bash
  python3 -m pip install --default-timeout=60 --retries=5 --trusted-host pypi.org --trusted-host files.pythonhosted.org -r requirements.txt
  ```
  Or install core packages from your OS (e.g., `sudo apt install python3-pandas python3-requests`) and remove heavy geospatial deps temporarily.
- If `merge_kenya_schools.py` errors with pandas groupby AttributeError referencing `.items()`, ensure the loop iterates over the GroupBy directly:
  ```py
  for county, group in all_df.groupby(all_df["county"].fillna("")):
      ...
  ```
- Some sources occasionally return 0 rows; the script will continue if one or more sources are missing, but check source URLs in `merge_kenya_schools.py` if you expect data.

Committing large files
- The current outputs are small (<50 MB) and can be committed normally.
- If you add very large data files in future, consider using Git LFS:
  ```bash
  sudo apt update
  sudo apt install -y git-lfs
  git lfs install
  git lfs track "*.csv"
  git lfs track "*.geojson"
  git add .gitattributes
  ```

